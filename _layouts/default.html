<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {% if page.last_updated %}{% if page.collection == 'active' or page.collection == 'proposed' %}
          <div style="margin-bottom: 20px; padding: 10px; background-color: #f8f9fa; border-left: 4px solid #007bff; font-size: 0.9em;">
            <strong>Last Updated:</strong> {{ page.last_updated | date: "%B %d, %Y" }}
          </div>
        {% endif %}{% endif %}
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- MathJax Configuration -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          displayMath: [['$$','$$'], ['\\[','\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        // Center justify equations in code and markdown cells.
        displayAlign: 'center',
        "HTML-CSS": {
          styles: {'.MathJax_Display': {"margin": 1}}
        }
      });
    </script>
    <script
      async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>

  </body>

</html>
