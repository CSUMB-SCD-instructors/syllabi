---
name: Build PDFs
"on":
  push:
    branches: [main]
    paths:
      - '_active/**/*.md'
      - '_proposed/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history lets us compare a push's before and after commits,
          # including pushes that contain more than one commit.
          fetch-depth: 0

      - name: Find changed syllabus sources
        id: sources
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_list="$RUNNER_TEMP/pdf-sources"

          # A manual run is deliberately a full rebuild. A new branch has no
          # usable "before" commit, so it is also treated as a full rebuild.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            find _active _proposed -type f -name '*.md' -print0 > "$source_list"
          else
            git diff --no-renames --name-only -z "$BEFORE_SHA" "$AFTER_SHA" -- _active _proposed > "$source_list"
          fi

          count=0
          while IFS= read -r -d '' source; do
            echo "Selected: $source"
            ((count += 1))
          done < "$source_list"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count syllabus source file(s)."

      - name: Install Pandoc
        if: ${{ steps.sources.outputs.count != '0' }}
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.2'

      - name: Install TinyTeX
        if: ${{ steps.sources.outputs.count != '0' }}
        uses: r-lib/actions/setup-tinytex@v2

      - name: Update tlmgr
        if: ${{ steps.sources.outputs.count != '0' }}
        run: tlmgr update --self

      - name: Install LaTeX packages
        if: ${{ steps.sources.outputs.count != '0' }}
        run: tlmgr install collection-latexrecommended xetex

      - name: Build PDFs for changed syllabi
        if: ${{ steps.sources.outputs.count != '0' }}
        shell: bash
        run: |
          set +e  # Continue building other syllabi if one source is invalid.
          success_count=0
          failure_count=0
          removed_count=0
          failed_files=""

          mkdir -p pdfs
          while IFS= read -r -d '' source; do
            filename=$(basename "${source%.*}")
            case "$source" in
              _active/*)
                output="pdfs/$filename.pdf"
                resource_path=".:_active:assets:images"
                ;;
              _proposed/*)
                output="pdfs/proposed-$filename.pdf"
                resource_path=".:_proposed:assets:images"
                ;;
              *)
                echo "Skipping unexpected path: $source"
                continue
                ;;
            esac

            # A deleted or renamed source should not leave its old PDF behind.
            if [ ! -f "$source" ]; then
              rm -f "$output"
              echo "Removed: $output (source deleted or renamed)"
              ((removed_count++))
              continue
            fi

            temporary_output="${output}.tmp"
            echo "Processing: $source -> $output"
            if pandoc "$source" -o "$temporary_output" \
              --pdf-engine=xelatex \
              -V geometry:margin=1in \
              --resource-path="$resource_path" 2>&1; then
              mv "$temporary_output" "$output"
              echo "✓ Success: $source"
              ((success_count++))
            else
              rm -f "$temporary_output"
              echo "✗ Failed: $source"
              failed_files="$failed_files\n  - $source"
              ((failure_count++))
            fi
          done < "$RUNNER_TEMP/pdf-sources"

          echo "PDFs: $success_count built, $removed_count removed, $failure_count failed"
          if [ "$failure_count" -gt 0 ]; then
            echo "Failed files:$failed_files"
          fi

      - name: Commit and push PDFs
        if: ${{ steps.sources.outputs.count != '0' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # -A includes PDFs removed because their source was deleted or renamed.
          git add -A pdfs
          if git diff --staged --quiet; then
            echo "No new or changed PDFs to commit"
          else
            pdf_count=$(git diff --staged --name-only | wc -l)
            git commit -m "Auto-generate PDFs - $pdf_count files 🤖"
            git push
          fi

      - name: Upload PDFs (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: syllabi-pdfs
          path: pdfs/
          if-no-files-found: warn
