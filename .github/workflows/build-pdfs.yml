---
name: Build PDFs
"on":
  push:
    branches: [main]
    paths:
      - '_active/**/*.md'
      - '_proposed/**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.2'

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: tlmgr install collection-latexrecommended xetex

      - name: Create pdfs directory
        run: mkdir -p pdfs

      - name: Build PDFs from active syllabi
        run: |
          success_count=0
          failure_count=0
          failed_files=""

          for f in $(find _active -name "*.md" -type f); do
            base=$(basename "${f%.*}")
            echo "Processing: $f -> pdfs/$base.pdf"

            if pandoc "$f" -o "pdfs/$base.pdf" \
              --pdf-engine=xelatex \
              -V geometry:margin=1in \
              --resource-path=".:_active:assets:images" 2>&1; then
              echo "✓ Success: $f"
              ((success_count++))
            else
              echo "✗ Failed: $f"
              failed_files="$failed_files\n  - $f"
              ((failure_count++))
            fi
          done

          echo "Active syllabi: $success_count succeeded, $failure_count failed"
          if [ $failure_count -gt 0 ]; then
            echo "Failed files:$failed_files"
          fi

      - name: Build PDFs from proposed syllabi
        run: |
          success_count=0
          failure_count=0
          failed_files=""

          for f in $(find _proposed -name "*.md" -type f); do
            base=$(basename "${f%.*}")
            echo "Processing: $f -> pdfs/proposed-$base.pdf"

            if pandoc "$f" -o "pdfs/proposed-$base.pdf" \
              --pdf-engine=xelatex \
              -V geometry:margin=1in \
              --resource-path=".:_proposed:assets:images" 2>&1; then
              echo "✓ Success: $f"
              ((success_count++))
            else
              echo "✗ Failed: $f"
              failed_files="$failed_files\n  - $f"
              ((failure_count++))
            fi
          done

          echo "Proposed: $success_count succeeded, $failure_count failed"
          if [ $failure_count -gt 0 ]; then
            echo "Failed files:$failed_files"
          fi

      - name: Generate build summary
        run: |
          pdf_count=$(find pdfs -name "*.pdf" -type f | wc -l)
          echo "📄 Generated $pdf_count PDF(s) total"

          if [ $pdf_count -gt 0 ]; then
            echo "Generated PDFs:"
            for pdf in pdfs/*.pdf; do
              if [ -f "$pdf" ]; then
                size=$(du -h "$pdf" | cut -f1)
                echo "  - $(basename "$pdf") ($size)"
              fi
            done
          fi

      - name: Commit and push PDFs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Only add PDFs that were successfully generated
          if find pdfs -name "*.pdf" -type f | grep -q .; then
            git add pdfs/*.pdf
            if git diff --staged --quiet; then
              echo "No new or changed PDFs to commit"
            else
              pdf_count=$(git diff --staged --name-only | wc -l)
              git commit -m "Auto-generate PDFs - $pdf_count files 🤖"
              git push
            fi
          else
            echo "No PDFs were generated successfully - nothing to commit"
          fi

      - name: Upload PDFs (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: syllabi-pdfs
          path: pdfs/
          if-no-files-found: warn
